const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "wt-app-key";
const stores = () => { const a = []; try { a.push(localStorage); } catch (e) {} try { a.push(sessionStorage); } catch (e) {} return a; };
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(BOX.salt), iterations: BOX.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BOX.iv)}, key, b64(BOX.data));
  const html = new TextDecoder().decode(plain);
  // Erst wenn diese Seite fertig geladen ist, sonst würde das Dashboard nur angehängt statt ersetzt
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, {once: true}));
  document.open(); document.write(html); document.close();
}
function forget() { for (const s of stores()) try { s.removeItem(KEY); } catch (e) {} }
async function tryStored() {
  // Gemerkt auf dem Gerät (localStorage) oder nur für diese Sitzung (sessionStorage, übersteht das Neuladen)
  let raw = null;
  for (const s of stores()) { try { raw = raw || s.getItem(KEY); } catch (e) {} }
  if (!raw) return false;
  try { await open(await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"])); return true; }
  catch (e) { forget(); return false; }
}
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const err = document.getElementById("err"), btn = document.querySelector("button");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Öffne …";
  try {
    const key = await deriveKey(document.getElementById("pw").value.trim().normalize("NFC"));
    await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BOX.iv)}, key, b64(BOX.data));
    const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
    try { sessionStorage.setItem(KEY, raw); } catch (e) {}
    if (document.getElementById("keep").checked) try { localStorage.setItem(KEY, raw); } catch (e) {}
    await open(key);
  } catch (e) { err.textContent = "Das Passwort stimmt nicht. Bitte noch einmal versuchen."; btn.disabled = false; btn.textContent = "Öffnen"; }
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
tryStored().then(ok => { if (!ok) document.getElementById("f").hidden = false; }, () => { document.getElementById("f").hidden = false; });
</script>
