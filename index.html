<style>
html,body{margin:0;min-height:100%;background:#070d24;color:#eef4ff;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{background-image:radial-gradient(900px 500px at 15% -10%,rgba(0,229,255,.12),transparent 60%),radial-gradient(700px 400px at 100% 0%,rgba(234,63,174,.10),transparent 60%);display:grid;place-items:center;min-height:100vh;padding:24px;box-sizing:border-box}
.box{width:100%;max-width:360px;text-align:center}
img{width:84px;height:84px;border-radius:20px;box-shadow:0 0 30px rgba(0,229,255,.35)}
h1{font-size:24px;margin:16px 0 4px}
p{color:#b6c3e8;margin:0 0 20px;font-size:14px}
input{width:100%;box-sizing:border-box;font:inherit;padding:13px 14px;border-radius:12px;border:1px solid rgba(0,229,255,.35);background:#0d1736;color:#eef4ff;outline:none}
input:focus{box-shadow:0 0 0 2px #00e5ff}
button{width:100%;margin-top:12px;font:inherit;font-weight:700;padding:13px;border:0;border-radius:12px;background:#00e5ff;color:#061026;box-shadow:0 0 22px rgba(0,229,255,.45);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
label{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:12px;font-size:13px;color:#b6c3e8}
label input{width:auto}
.err{color:#ff5c7a;min-height:1.5em;margin-top:10px;font-size:14px}
.hint{margin-top:22px;font-size:12px;color:#8391bb}
</style>
</head>

  <label><input type="checkbox" id="keep" checked> Auf diesem Gerät merken</label>

</form>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY = "wt-app-key";
const stores = () => { const a = []; try { a.push(localStorage); } catch (e) {} try { a.push(sessionStorage); } catch (e) {} return a; };
async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name: "PBKDF2", salt: b64(BOX.salt), iterations: BOX.iter, hash: "SHA-256"}, base, {name: "AES-GCM", length: 256}, true, ["decrypt"]);
}
async function open(key) {
  const plain = await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BOX.iv)}, key, b64(BOX.data));
  const html = new TextDecoder().decode(plain);
  // Erst wenn diese Seite fertig geladen ist, sonst würde das Dashboard nur angehängt statt ersetzt
  if (document.readyState === "loading") await new Promise(r => document.addEventListener("DOMContentLoaded", r, {once: true}));
  document.open(); document.write(html); document.close();
}
function forget() { for (const s of stores()) try { s.removeItem(KEY); } catch (e) {} }
async function tryStored() {
  // Gemerkt auf dem Gerät (localStorage) oder nur für diese Sitzung (sessionStorage, übersteht das Neuladen)
  let raw = null;
  for (const s of stores()) { try { raw = raw || s.getItem(KEY); } catch (e) {} }
  if (!raw) return false;
  try { await open(await crypto.subtle.importKey("raw", b64(raw), "AES-GCM", false, ["decrypt"])); return true; }
  catch (e) { forget(); return false; }
}
document.getElementById("f").onsubmit = async ev => {
  ev.preventDefault();
  const err = document.getElementById("err"), btn = document.querySelector("button");
  err.textContent = ""; btn.disabled = true; btn.textContent = "Öffne …";
  try {
    const key = await deriveKey(document.getElementById("pw").value.trim().normalize("NFC"));
    await crypto.subtle.decrypt({name: "AES-GCM", iv: b64(BOX.iv)}, key, b64(BOX.data));
    const raw = btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey("raw", key))));
    try { sessionStorage.setItem(KEY, raw); } catch (e) {}
    if (document.getElementById("keep").checked) try { localStorage.setItem(KEY, raw); } catch (e) {}
    await open(key);
  } catch (e) { err.textContent = "Das Passwort stimmt nicht. Bitte noch einmal versuchen."; btn.disabled = false; btn.textContent = "Öffnen"; }
};
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
tryStored().then(ok => { if (!ok) document.getElementById("f").hidden = false; }, () => { document.getElementById("f").hidden = false; });
